name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown,wasm32v1-none

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      # CONTRIBUTING.md asks contributors to run both before committing, but the
      # pre-commit hook only covers fmt and `--no-verify` skips it entirely.
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # The root lockfile covers the contract workspace only; indexer has its
      # own lockfile and is audited separately below.
      - name: Audit Rust dependencies
        # These are transitive Soroban-host advisories with no compatible
        # upstream replacement in the SDK 22 dependency graph. Keep the audit
        # blocking for every other advisory and document the narrow exceptions.
        run: >
          cargo audit --deny warnings
          --ignore RUSTSEC-2024-0388
          --ignore RUSTSEC-2024-0436
          --ignore RUSTSEC-2023-0031

      - name: Audit indexer Rust dependencies
        run: cargo audit --file indexer/Cargo.lock --deny warnings

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # TODO(next-bounty): non-blocking. All 7 advisories come in through
      # @stellar/stellar-sdk ^12 (toml, and its own transitive deps); clearing
      # them means moving the SDK to stellar-sdk 15+, which is a breaking
      # upgrade and its own piece of work. Drop the flag once that lands.
      - name: Audit SDK dependencies
        working-directory: sdk
        run: npm audit --audit-level=high
        continue-on-error: true

      # Advisory until known vulnerabilities in the shared workspace lockfile
      # are resolved; retain the audit report without making CI permanently red.
      - name: Audit relayer dependencies
        run: npm audit --workspace=@stellar/c-address-onboarding-bridge-relayer --audit-level=high
        continue-on-error: true

  contract:
    name: Soroban Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown,wasm32v1-none

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      # Build the legacy WASM artifact used by the hash check and upload step.
      - name: Build WASM (wasm32-unknown-unknown)
        run: cargo build -p onboarding-bridge --release --target wasm32-unknown-unknown

      # Fast fail on type errors (including the test target) before paying for
      # a full release build. A red main here is exactly what this job exists
      # to catch -- see the "Soroban Contract" checklist in the CI issue.
      - name: cargo check
        run: cargo check -p onboarding-bridge --all-targets --features testutils

      - name: Build contract
        run: cargo build -p onboarding-bridge --release

      # wasm32v1-none is the canonical Soroban release artifact. Its hash is
      # verified below using the same Rust toolchain and target as release.yml.
      - name: Build WASM (wasm32v1-none)
        run: cargo build -p onboarding-bridge --release --target wasm32v1-none

      - name: Verify WASM Hash
        run: |
          COMPUTED_HASH=$(sha256sum target/wasm32v1-none/release/onboarding_bridge.wasm | cut -d' ' -f1)
          if [ ! -f wasm_hash.txt ]; then
            echo "::error::wasm_hash.txt not found!"
            exit 1
          fi
          KNOWN_HASH=$(cat wasm_hash.txt | xargs)
          echo "Computed WASM Hash: $COMPUTED_HASH"
          echo "Known Good Hash:    $KNOWN_HASH"
          if [ "$COMPUTED_HASH" != "$KNOWN_HASH" ]; then
            echo "::error::Compiled WASM hash ($COMPUTED_HASH) does not match the known good hash ($KNOWN_HASH)!"
            echo "If this change was intentional, please update the hash in wasm_hash.txt."
            exit 1
          fi

      # `cargo check` alone never compiles #[cfg(test)] code (or benchmarks.rs,
      # which is pulled in as a #[cfg(test)] module), so it can pass while the
      # test target is completely broken. `cargo test` is the only thing that
      # actually compiles and runs the suite.
      - name: Run contract tests
        run: set -o pipefail; cargo test -p onboarding-bridge --features testutils 2>&1 | tee contract_test_output.txt

      # Surfaces the pass/fail count in the job summary so a suite that
      # silently shrinks (fewer tests collected, not just fewer passing) is
      # visible without digging through raw log output.
      - name: Report contract test count
        run: |
          COUNT_LINE=$(grep -E "^test result:" contract_test_output.txt | tail -n1)
          if [ -z "$COUNT_LINE" ]; then
            echo "::error::No 'test result:' line found in contract test output -- the suite may not have run at all."
            exit 1
          fi
          if [[ "$COUNT_LINE" == "test result: FAILED"* ]]; then
            echo "::error::Contract tests reported failures: $COUNT_LINE"
            exit 1
          fi
          echo "$COUNT_LINE"
          {
            echo "### Contract test results"
            echo ""
            echo "\`$COUNT_LINE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The indexer is its own Cargo workspace root (see indexer/Cargo.toml),
      # so its test target rots silently unless something explicitly builds
      # and runs it too -- same rationale as the contract test step above.
      - name: Run indexer tests
        working-directory: indexer
        run: set -o pipefail; cargo test 2>&1 | tee ../indexer_test_output.txt

      - name: Report indexer test count
        run: |
          COUNT_LINE=$(grep -E "^test result:" indexer_test_output.txt | tail -n1)
          if [ -z "$COUNT_LINE" ]; then
            echo "::error::No 'test result:' line found in indexer test output -- the suite may not have run at all."
            exit 1
          fi
          if [[ "$COUNT_LINE" == "test result: FAILED"* ]]; then
            echo "::error::Indexer tests reported failures: $COUNT_LINE"
            exit 1
          fi
          echo "$COUNT_LINE"
          {
            echo "### Indexer test results"
            echo ""
            echo "\`$COUNT_LINE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run benchmarks
        shell: bash
        run: |
          cargo test -p onboarding-bridge --features testutils bench_ -- --nocapture 2>/dev/null \
            | grep '^BENCH' \
            | awk 'BEGIN{print "function\tcpu_instructions\tmemory_bytes"} {print $2"\t"$3"\t"$4}' \
            > bench_results.txt
          echo "--- Benchmark Results ---"
          column -t bench_results.txt

      # TODO(next-bounty): advisory only, for three separate reasons:
      #   1. bench_baseline.txt still carries 11 rows marked "placeholder
      #      entries -- run benchmarks to capture real values" with 0/0 values,
      #      which this script deliberately rejects as an invalid baseline.
      #   2. The rows that do have numbers were captured on a different
      #      toolchain/SDK; batch_fund_c_address already measures 45-57% above
      #      them, which is drift, not a regression introduced by any one change.
      #   3. Most benchmarked entry points are still todo!() stubs, so the
      #      figures do not describe the finished contract anyway.
      # Regenerate the baseline deliberately once the contract is implemented,
      # then make this blocking again.
      - name: Check gas regressions
        continue-on-error: true
        run: |
          if [ -f bench_baseline.txt ]; then
            python3 - <<'EOF'
          import sys
          baseline = {}
          invalid_baselines = []
          with open("bench_baseline.txt") as f:
              next(f)  # skip header
              for line_no, line in enumerate(f, start=2):
                  parts = line.strip().split("\t")
                  if len(parts) == 3:
                      cpu, mem = int(parts[1]), int(parts[2])
                      baseline[parts[0]] = (cpu, mem)
                      if cpu == 0 and mem == 0:
                          invalid_baselines.append(f"{line_no}: {parts[0]}")

          if invalid_baselines:
              print("INVALID BENCHMARK BASELINE: zero cpu/memory rows found:")
              for row in invalid_baselines:
                  print(" ", row)
              sys.exit(1)

          results = {}
          with open("bench_results.txt") as f:
              next(f)  # skip header
              for line in f:
                  parts = line.strip().split("\t")
                  if len(parts) == 3:
                      results[parts[0]] = (int(parts[1]), int(parts[2]))

          THRESHOLD = 0.20  # 20% regression threshold
          regressions = []
          for name, (cpu, mem) in results.items():
              if name in baseline:
                  base_cpu, base_mem = baseline[name]
                  if base_cpu > 0 and (cpu - base_cpu) / base_cpu > THRESHOLD:
                      regressions.append(f"{name}: CPU {base_cpu} -> {cpu} (+{(cpu-base_cpu)*100//base_cpu}%)")
                  if base_mem > 0 and (mem - base_mem) / base_mem > THRESHOLD:
                      regressions.append(f"{name}: MEM {base_mem} -> {mem} (+{(mem-base_mem)*100//base_mem}%)")

          if regressions:
              print("GAS REGRESSIONS DETECTED (>20% increase):")
              for r in regressions:
                  print(" ", r)
              sys.exit(1)
          else:
              print("No gas regressions detected.")
          EOF
          else
            echo "No baseline file found -- saving current results as baseline."
            cp bench_results.txt bench_baseline.txt
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench_results.txt

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-bridge-wasm
          path: target/wasm32-unknown-unknown/release/*.wasm

  contract-compatibility:
    name: Contract Compatibility (Soroban SDK ${{ matrix.soroban-sdk-version }}.x)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # SDK 22 is the release baseline; SDK 23 is checked separately so
        # compatibility regressions are not hidden by the default build.
        soroban-sdk-version: ["22", "23"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown,wasm32v1-none

      - name: Pin Soroban SDK major version
        run: |
          sed -i -E "s/^soroban-sdk = \".*\"$/soroban-sdk = \"${{ matrix.soroban-sdk-version }}\"/" contracts/onboarding-bridge/Cargo.toml
          sed -i -E "s/^soroban-sdk = \{ version = \".*\", features = \[\"testutils\"\] \}$/soroban-sdk = { version = \"${{ matrix.soroban-sdk-version }}\", features = [\"testutils\"] }/" contracts/onboarding-bridge/Cargo.toml

      - name: Update lockfile for selected Soroban SDK
        run: cargo update -p soroban-sdk --workspace

      - name: Show resolved Soroban SDK version
        run: cargo tree -p onboarding-bridge -e normal,dev | grep soroban-sdk | head -n 2

      - name: Build contract
        run: cargo build -p onboarding-bridge --release

      - name: Run contract tests
        run: cargo test -p onboarding-bridge --features testutils

  indexer:
    name: Indexer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown,wasm32v1-none

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: indexer

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo check
        run: cargo check --all-targets

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: sdk/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('sdk/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Check SDK documentation examples
        working-directory: .
        run: node scripts/check-migration-sdk-docs.js

      - name: Check SDK API reference completeness
        working-directory: .
        run: node scripts/check-api-reference.js

      - name: Build SDK
        run: npm run build

  # Type-check the example programs against the built SDK so API drift (e.g.
  # batchFundCAddresses returning TransactionResult[] instead of a single
  # TransactionResult) fails CI instead of shipping a broken example. See #851.
  examples:
    name: Examples (type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Root install creates the workspace symlink for the SDK and makes the
      # SDK's own dependencies (e.g. @stellar/stellar-sdk) resolvable from
      # examples/ via standard node_modules lookup.
      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build --workspace=sdk

      - name: Type-check TypeScript example
        run: npm run check:examples

      - name: Syntax-check JavaScript example
        run: node --check examples/javascript/full-integration.js

  sdk-matrix:
    name: SDK Compatibility Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
        npm-version: [9, 10]
      fail-fast: false
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup npm ${{ matrix.npm-version }}
        run: npm install -g npm@${{ matrix.npm-version }}

      - name: Display versions
        run: |
          node --version
          npm --version

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: sdk/node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-npm-${{ matrix.npm-version }}-${{ hashFiles('sdk/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-npm-
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build SDK
        run: npm run build

  relayer:
    name: Relayer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run deployment script tests
        run: npm run test:scripts
      - name: Type-check deployment script
        run: npx tsc --noEmit --skipLibCheck --target ES2022 --module commonjs --esModuleInterop scripts/deploy.ts

      - name: Build SDK
        run: npm run build --workspace=sdk

      - name: Type-check relayer
        working-directory: relayer
        run: npm run typecheck

      - name: Run self-test
        working-directory: relayer
        run: npm run self-test
