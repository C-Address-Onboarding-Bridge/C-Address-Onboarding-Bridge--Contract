name: Publish Contract

on:
  push:
    tags:
      - 'contract-v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  publish:
    name: Publish Contract WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown,wasm32v1-none

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run contract tests
        run: cargo test -p onboarding-bridge --features testutils

      - name: Build WASM (release)
        run: cargo build -p onboarding-bridge --release --target wasm32v1-none

      - name: Verify WASM hash
        run: |
          WASM_PATH="target/wasm32v1-none/release/onboarding_bridge.wasm"
          ACTUAL_HASH=$(sha256sum "$WASM_PATH" | awk '{print $1}')
          EXPECTED_HASH=$(cat wasm_hash.txt | tr -d '[:space:]')
          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "::error::WASM hash mismatch for the pinned release build."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install release dependencies
        run: npm ci --ignore-scripts

      - name: Sign release metadata
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: node scripts/sign-release.js target/wasm32v1-none/release/onboarding_bridge.wasm

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p onboarding-bridge

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            target/wasm32v1-none/release/onboarding_bridge.wasm \
            registry/releases.json \
            registry/address_onboarding_bridge-${{ github.ref_name }}-verification.json \
            --title "${{ github.ref_name }}" \
            --generate-notes

      # Persist the signed registry so verify-release.js finds the entry in the
      # repository checkout, not only in the GitHub Release asset.
      - name: Commit updated registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/releases.json registry/address_onboarding_bridge-${{ github.ref_name }}-verification.json
          if git diff --cached --quiet; then
            echo "Registry already up to date."
            exit 0
          fi
          git commit -m "chore(release): record ${{ github.ref_name }} in registry"
          git push origin HEAD:main
