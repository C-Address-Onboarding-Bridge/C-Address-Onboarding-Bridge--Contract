name: Publish Contract

on:
  push:
    tags:
      - 'contract-v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish Contract WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      # The upgrade tests in src/tests.rs `include_bytes!` the release wasm, so
      # the wasm has to exist BEFORE anything compiles the test target. Building
      # it first keeps `cargo test` from failing on a clean runner (same
      # ordering fix as the Soroban Contract job in ci.yml).
      - name: Build WASM (release)
        run: cargo build -p onboarding-bridge --release --target wasm32-unknown-unknown

      - name: Run contract tests
        run: cargo test -p onboarding-bridge --features testutils

      - name: Build WASM (wasm32v1-none)
        run: cargo build -p onboarding-bridge --release --target wasm32v1-none

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-bridge-wasm
          path: |
            target/wasm32-unknown-unknown/release/onboarding_bridge.wasm
            target/wasm32v1-none/release/onboarding_bridge.wasm
