name: Deployment Verification Smoke Tests

on:
  workflow_dispatch:
    inputs:
      contract_address:
        description: 'Deployed contract address'
        required: true
        type: string
      network:
        description: 'Network (testnet or mainnet)'
        required: true
        type: choice
        options:
          - testnet
          - mainnet

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke-tests:
    name: Smoke Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Stellar SDK
        working-directory: sdk
        run: npm install --no-save --package-lock=false --ignore-scripts @stellar/stellar-sdk@^13.0.0

      - name: Build smoke tests
        run: cargo build -p onboarding-bridge --release --features testutils

      # Confirms the address resolves to a contract instance and simulates a
      # read-only query against it. The Rust tests below exercise behavior locally.
      - name: Verify contract exists on ${{ inputs.network }}
        env:
          CONTRACT_ADDRESS: ${{ inputs.contract_address }}
          NETWORK: ${{ inputs.network }}
        working-directory: sdk
        run: |
          set -euo pipefail

          node <<'NODE'
          const {
            Account,
            Address,
            Contract,
            Networks,
            TransactionBuilder,
            rpc,
            scValToNative,
            xdr,
          } = require('@stellar/stellar-sdk');

          async function main() {
            const contractId = process.env.CONTRACT_ADDRESS;
            const network = process.env.NETWORK;
            const networkConfig = {
              testnet: {
                rpcUrl: 'https://soroban-testnet.stellar.org',
                passphrase: Networks.TESTNET,
              },
              mainnet: {
                rpcUrl: 'https://mainnet.sorobanrpc.com',
                passphrase: Networks.PUBLIC,
              },
            }[network];

            if (!networkConfig) throw new Error(`Unknown network "${network}".`);

            const contractAddress = Address.fromString(contractId);
            const ledgerKey = xdr.LedgerKey.contractData(
              new xdr.LedgerKeyContractData({
                contract: contractAddress.toScAddress(),
                key: xdr.ScVal.scvLedgerKeyContractInstance(),
                durability: xdr.ContractDataDurability.persistent(),
              }),
            );
            const server = new rpc.Server(networkConfig.rpcUrl);
            const entryResponse = await server.getLedgerEntries(ledgerKey);
            if (!entryResponse.entries?.length) {
              throw new Error(`No deployed contract instance found for ${contractId} on ${network}.`);
            }

            const account = new Account(
              'GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWHF',
              '0',
            );
            const tx = new TransactionBuilder(account, {
              fee: '100',
              networkPassphrase: networkConfig.passphrase,
            })
              .addOperation(new Contract(contractId).call('query_is_initialized'))
              .setTimeout(30)
              .build();
            const simulation = await server.simulateTransaction(tx);
            if (simulation.error) throw new Error(`Contract simulation failed: ${simulation.error}`);
            const initialized = simulation.results?.[0]?.retval;
            if (!initialized || scValToNative(initialized) !== true) {
              throw new Error(`${contractId} is not initialized on ${network}.`);
            }
            console.log(`Verified initialized contract ${contractId} on ${network}.`);
          }

          main().catch((error) => {
            console.error(error.message || error);
            process.exit(1);
          });
          NODE

      - name: Run smoke tests
        env:
          CONTRACT_ADDRESS: ${{ inputs.contract_address }}
          NETWORK: ${{ inputs.network }}
        run: |
          set -euo pipefail

          # Tee so the result line can be inspected: `cargo test` exits 0 when a
          # filter matches nothing, which previously let this job pass while
          # running no tests at all.
          cargo test -p onboarding-bridge --lib smoke_ --features testutils \
            2>&1 | tee smoke-output.txt

          if ! grep -qE '^test result: ok\.' smoke-output.txt; then
            echo "::error::Smoke test run did not report a successful result line."
            exit 1
          fi

          PASSED=$(grep -oE '^test result: ok\. [0-9]+ passed' smoke-output.txt \
            | grep -oE '[0-9]+' | head -1)
          PASSED=${PASSED:-0}

          echo "Smoke tests passed: $PASSED"
          if [ "$PASSED" -eq 0 ]; then
            echo "::error::The 'smoke_' filter matched 0 tests — smoke coverage is missing."
            echo "::error::Add tests named smoke_* to contracts/onboarding-bridge/src/smoke_tests.rs."
            exit 1
          fi

      - name: Report smoke test results
        if: always()
        run: |
          echo "Smoke tests completed for contract: ${{ inputs.contract_address }}"
          echo "Network: ${{ inputs.network }}"
