[package]
name = "onboarding-bridge"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# `rlib` alongside `cdylib` so benches/ and integration targets can link the
# crate (`use onboarding_bridge::...`). The deployed artifact is still the
# cdylib; adding rlib does not change the emitted wasm.
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
proptest = "1.5"

[features]
testutils = ["soroban-sdk/testutils"]
